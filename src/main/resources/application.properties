spring.application.name=coworkhub

# ===== Servidor =====
server.port=8080

# ===== Base de datos (MySQL por defecto) =====
# Crear la base y el usuario con:
#   CREATE DATABASE coworkhub CHARACTER SET utf8mb4;
#   CREATE USER 'coworkhub'@'%' IDENTIFIED BY 'coworkhub';
#   GRANT ALL PRIVILEGES ON coworkhub.* TO 'coworkhub'@'%';
# Para ejecutar sin MySQL: mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:mysql://localhost:3306/coworkhub?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=coworkhub
spring.datasource.password=coworkhub

# 'create' borra y recrea las tablas en cada arranque y ejecuta import.sql.
# Es apropiado para un proyecto educativo con datos de prueba.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Aplicacion =====
# Reloj de negocio: las reglas de fechas usan esta zona horaria.
coworkhub.reloj.zona=America/Argentina/Buenos_Aires

# ===== Seguridad JWT =====
# Clave educativa de ejemplo: en un sistema real va en una variable de entorno.
# Debe tener al menos 32 caracteres o la aplicacion no arranca.
coworkhub.jwt.secreto=coworkhub-clave-educativa-de-mas-de-32-caracteres
coworkhub.jwt.expiracion-minutos=60

# ===== Documentacion OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.packages-to-scan=com.coworkhub
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ===== Actuator =====
# Solo se expone la salud, publica y sin detalles.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
