spring.application.name=coworkhub
server.port=8080

# Base de datos MySQL (ver README.md para crearla con MySQL instalado o con Docker).
# Si el puerto 3306 esta ocupado, usa 3307 y ajusta la URL.
spring.datasource.url=jdbc:mysql://localhost:3306/coworkhub
spring.datasource.username=coworkhub
spring.datasource.password=coworkhub

# 'create' borra y recrea las tablas en cada arranque y ejecuta import.sql.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Solo se expone el endpoint de salud publicamente.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
