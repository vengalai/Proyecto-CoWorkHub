# Configuracion exclusiva de las pruebas automatizadas.
# Las pruebas no dependen de un MySQL local; usan H2 en memoria.
spring.datasource.url=jdbc:h2:mem:coworkhub;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.import_files=import-h2.sql
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false

# Reloj y JWT necesarios para crear los beans durante las pruebas.
coworkhub.reloj.zona=America/Argentina/Buenos_Aires
coworkhub.jwt.secreto=clave-de-pruebas-de-coworkhub-con-mas-de-32-caracteres
coworkhub.jwt.expiracion-minutos=60
